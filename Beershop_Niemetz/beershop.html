<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beershop</title>
     <style>

        body{
            margin: 0;
            font-family: Arial;
            background-color: white;
        }

        .okvir{
            width: 850px;
            margin: 40px auto;
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px lightgray;
        }

        h1{
            text-align: center;
            color: #3a3838;
        }

        .opis{
            text-align: center;
            color: #474747;
            margin-bottom: 25px;
        }

        table{
            width: 100%;
            border-collapse: collapse;
        }

        th{
            background-color: #d48427;
            color: white;
            padding: 12px;
        }

        td{
            text-align: center;
            padding: 10px;
            border-bottom: 1px solid lightgray;
        }

        input{
            width: 70px;
            padding: 5px;
            text-align: center;
        }

        .gumbi{
            text-align: center;
            margin-top: 20px;
        }

        button{
            background-color: #d48427;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 5px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover{
            background-color: #d48427;
        }

        .kosarica{
            margin-top: 30px;
            background-color: white;
            border: 1px solid lightgray;
            border-radius: 8px;
            padding: 20px;
        }

        .ukupno{
            margin-top: 15px;
            background-color: #d48427;
            color: white;
            text-align: center;
            padding: 12px;
            border-radius: 5px;
            font-size: 20px;
        }

    </style>

</head>
<body>

    <div class="okvir">

    <h1>Beershop</h1>

    <p class="opis">
        Odaberite količinu željenih proizvoda i dodajte ih u košaricu.
    </p>

    <table>

        <tr>
            <th>Pivo</th>
            <th>Cijena</th>
            <th>Količina</th>
        </tr>

        <tr>
            <td>Ožujsko</td>
            <td>2 €</td>
            <td><input type="text" id="ozujsko" value="0"></td>
        </tr>

        <tr>
            <td>Karlovačko</td>
            <td>2 €</td>
            <td><input type="text" id="karlovacko" value="0"></td>
        </tr>

        <tr>
            <td>Pan</td>
            <td>2 €</td>
            <td><input type="text" id="pan" value="0"></td>
        </tr>

        <tr>
            <td>Laško</td>
            <td>3 €</td>
            <td><input type="text" id="lasko" value="0"></td>
        </tr>

        <tr>
            <td>Heineken</td>
            <td>3 €</td>
            <td><input type="text" id="heineken" value="0"></td>
        </tr>

        <tr>
            <td>Stella Artois</td>
            <td>4 €</td>
            <td><input type="text" id="stella" value="0"></td>
        </tr>

        <tr>
            <td>Guinness</td>
            <td>5 €</td>
            <td><input type="text" id="guinness" value="0"></td>
        </tr>

    </table>

    <div class="gumbi">

        <button onclick="dodajUKosaricu()">
            Dodaj u košaricu
        </button>

        <button onclick="obrisiKosaricu()">
            Obriši košaricu
        </button>

    </div>

    <div class="kosarica">

        <h2>Košarica</h2>

        <div id="rezultat">
            Košarica je prazna.
        </div>

        <div class="ukupno" id="ukupno">
            Ukupno: 0 €
        </div>

    </div>

</div>

<script>

function dodajUKosaricu(){

    let ozujsko = document.getElementById("ozujsko").value;
    let karlovacko = document.getElementById("karlovacko").value;
    let pan = document.getElementById("pan").value;
    let lasko = document.getElementById("lasko").value;
    let heineken = document.getElementById("heineken").value;
    let stella = document.getElementById("stella").value;
    let guinness = document.getElementById("guinness").value;

    let ukupno = 0;
    let ispis = "";

    ispis += "<table>";
    ispis += "<tr><th>Pivo</th><th>Količina</th><th>Iznos</th></tr>";

    if(Number(ozujsko) > 0){
        ispis += "<tr><td>Ožujsko</td><td>" + ozujsko + "</td><td>" + Number(ozujsko) * 2 + " €</td></tr>";
        ukupno += Number(ozujsko) * 2;
    }

    if(Number(karlovacko) > 0){
        ispis += "<tr><td>Karlovačko</td><td>" + karlovacko + "</td><td>" + Number(karlovacko) * 2 + " €</td></tr>";
        ukupno += Number(karlovacko) * 2;
    }

    if(Number(pan) > 0){
        ispis += "<tr><td>Pan</td><td>" + pan + "</td><td>" + Number(pan) * 2 + " €</td></tr>";
        ukupno += Number(pan) * 2;
    }

    if(Number(lasko) > 0){
        ispis += "<tr><td>Laško</td><td>" + lasko + "</td><td>" + Number(lasko) * 3 + " €</td></tr>";
        ukupno += Number(lasko) * 3;
    }

    if(Number(heineken) > 0){
        ispis += "<tr><td>Heineken</td><td>" + heineken + "</td><td>" + Number(heineken) * 3 + " €</td></tr>";
        ukupno += Number(heineken) * 3;
    }

    if(Number(stella) > 0){
        ispis += "<tr><td>Stella Artois</td><td>" + stella + "</td><td>" + Number(stella) * 4 + " €</td></tr>";
        ukupno += Number(stella) * 4;
    }

    if(Number(guinness) > 0){
        ispis += "<tr><td>Guinness</td><td>" + guinness + "</td><td>" + Number(guinness) * 5 + " €</td></tr>";
        ukupno += Number(guinness) * 5;
    }

    ispis += "</table>";

    if(ukupno == 0){
        ispis = "Košarica je prazna.";
    }

    document.getElementById("rezultat").innerHTML = ispis;
    document.getElementById("ukupno").innerHTML = "Ukupno: " + ukupno + " €";
}

function obrisiKosaricu(){

    document.getElementById("ozujsko").value = 0;
    document.getElementById("karlovacko").value = 0;
    document.getElementById("pan").value = 0;
    document.getElementById("lasko").value = 0;
    document.getElementById("heineken").value = 0;
    document.getElementById("stella").value = 0;
    document.getElementById("guinness").value = 0;

    document.getElementById("rezultat").innerHTML = "Košarica je prazna.";
    document.getElementById("ukupno").innerHTML = "Ukupno: 0 €";
}

</script>

</body>
</html>
